name: Update orbit data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TLEs from CelesTrak
        run: |
          mkdir -p satellites/data
          fetch() {
            curl -fsS --retry 3 --retry-delay 10 \
              "https://celestrak.org/NORAD/elements/gp.php?$2&FORMAT=tle" -o "/tmp/$1.tle"
            grep -q '^1 ' "/tmp/$1.tle"
            mv "/tmp/$1.tle" "satellites/data/$1.tle"
          }
          fetch landsat  "NAME=LANDSAT"
          fetch sentinel "NAME=SENTINEL"
          fetch noaa20   "CATNR=43013"
          fetch noaa21   "CATNR=54234"
          fetch smap     "CATNR=40376"
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > satellites/data/updated.json

      - name: Copy into the published folder
        run: |
          mkdir -p docs/satellites/data
          cp satellites/data/* docs/satellites/data/
          cp satellites/index.html docs/satellites/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellites/data docs/satellites
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update orbit data"
            git pull --rebase
            git push
          fi
